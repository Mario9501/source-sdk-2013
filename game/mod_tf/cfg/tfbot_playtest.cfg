// TFBot overhaul: playtest settings (docs/tfbot/DESIGN.md)
// Usage, in the console of a listen server you host:  exec tfbot_playtest
//
// Turns every overhaul feature on for both teams and fills the server with
// bots. To compare against stock bots, set one team back to stock, e.g.
//   tf_bot_features_blu stock
// Bots read their team's features when they spawn, so changes apply to each
// bot from its next respawn.

tf_bot_features_red "all"
tf_bot_features_blu "all"

tf_bot_difficulty 2				// 0 new, 1 casual, 2 experienced, 3 competitive (tiers)
tf_bot_human_tier 2				// how each human counts when bot profiles balance the teams
tf_bot_quota_mode "fill"		// bots fill the slots humans don't use
tf_bot_quota 24
tf_bot_join_after_player 1

// Useful while playtesting:
//   tf_bot_features_list            which features are on for which team
//   tf_bot_profile_list             the profile each bot is using
//   tf_bot_profile_editor           tune profiles live (sliders)
//   tf_bot_record_player <you>      record your playstyle; later tf_bot_profile_from_record <you>
//   tf_bot_nav_validate             check the current map's nav mesh
//   sv_cheats 1; tf_bot_aim_error_scale 0.5   sharper aim for every tier (1.5 = sloppier;
//                                   1.0 is calibrated to match stock bots of the same difficulty)

echo "TFBot playtest settings loaded: all overhaul features on for both teams"
